<main class="safe"><tutorial-panel id="intro-song" tutorial="encore_intro_v1"></tutorial-panel><div class="song-heading"><div data-style-color="hud-accent" class="song-name" data-text-reserve="Midnight Relay">{{song-name}}</div><div class="meta" data-text-reserve="888 · 888 BPM · 888">{{difficulty}} · {{bpm}} BPM · {{stage}}</div><div class="progress"><img src="UI/fill.png" data-style-image-fill-amount="progress"></div></div><button class="leave" data-on-click="event:leave" data-key="leave" data-text-reserve="MMMMMMMMMMMMMMMM">{{leave-label}}</button><button class="flow-toggle" data-on-click="event:toggle-downscroll" data-key="downscroll" data-text-reserve="Downscroll OFF">{{flow-label}}</button><div class="receptor-feedback" data-if="receptor-feedback" data-style-transform-y="feedback-y" data-style-opacity="receptor-rating-alpha"><div data-style-color="receptor-rating-color" data-text-reserve="SICK!">{{receptor-rating}}</div></div><div class="rival-score"><div class="rival-tag" data-text-reserve="Perfect BOT">{{rival-label}}</div><div data-text-reserve="9999999">{{bot-score}}</div></div><div class="player-score"><div class="rival-tag" data-text-reserve="Nova">{{player-label}}</div><div data-text-reserve="9999999">{{score}}</div></div><div class="countdown" data-if="countdown" data-text-reserve="4">{{count}}</div><div class="cutscene" data-if="dialogue"><img src="UI/rival_icon.png"><div data-text-reserve="MMMMMMMMMMMMMMMM">{{dialogue-text}}</div></div><div class="health-footer" data-style-transform-y="health-y"><div class="health"><img class="icon themed-icon" src="UI/rival_icon.png" data-style-color="rival-icon-color"><div class="track"><img data-style-color="hud-accent" class="fill" src="UI/fill.png" data-style-image-fill-amount="health"></div><img class="icon themed-icon" src="UI/player_icon.png" data-style-color="player-icon-color"></div><div class="stats"><div data-text-reserve="100.00%">{{accuracy}}</div><div data-text-reserve="9999">{{combo}} COMBO</div><div data-text-reserve="9999">{{misses}} MISSES</div></div></div><div class="milestone" data-if="milestone" data-style-opacity="milestone-alpha" data-style-transform-scale="milestone-scale" data-style-transform-y="milestone-y"><div class="milestone-number" data-text-reserve="200">{{milestone-number}}</div><div>COMBO</div></div><div class="achievement" data-if="achievement" data-text-reserve="Published Artist">{{achievement-name}}</div></main>
